<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EEF1FF">
  <meta name="description" content="Coomeet onboarding">

  <link rel="stylesheet" href="styles.css">
  <script src="config.js" defer></script>

<body>
  <main class="phone" aria-label="Coomeet introduction">
    <header class="header">
      <button class="icon-button back" id="back" aria-label="Previous screen" hidden></button>
      <a class="brand" href="#1" aria-label="Coomeet home">
        <svg class="bird" viewBox="0 0 32 28" aria-hidden="true"><path d="M3 16.5C5 8 13 1.5 22.5 2.2c-3.8 3.2-5.2 7.2-3.4 11.2 3.6-.6 7.4 1.2 10.9 5.2-3.6-.6-7.2.4-10.2 3.1C14 26.8 8.8 26 5.6 21.2 3.8 18.6 3 17.4 3 16.5Z"/></svg>
        <span>Coo<span>meet</span></span>

      <span class="online-count" title="Illustrative online count"><i class="online-dot"></i><span id="online">1.2K</span> online</span>
    </header>
    <nav class="progress" aria-label="Your progress" hidden></nav>
    <section id="screen" class="screen" aria-live="polite"></section>
    <footer id="footer" class="footer"></footer>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-content"><button id="close-dialog" class="icon-button close-dialog" aria-label="Close"></button><div id="dialog-body"></div></div></dialog>
  <div id="announcement" class="sr-only" role="status"></div>
</body>
</html>
